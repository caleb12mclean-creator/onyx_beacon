workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build ipa
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa