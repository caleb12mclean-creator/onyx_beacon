name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Xcode Code Signing Completely
        run: |
          # Disable code signing requirements in Xcode project file
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          # Inject flags to disable code signing allowance/requirements entirely
          python3 -c '
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          # Add CODE_SIGNING_ALLOWED = NO where build settings are defined
          content = content.replace("isa = XCBuildConfiguration;", "isa = XCBuildConfiguration;\n\t\t\tbuildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t};")
          # A cleaner approach is replacing specific lines or adding keys
          '
          # Alternative reliable sed injection for project.pbxproj
          find ios/Runner.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/ASSETCATALOG_COMPILER_APP_ICON_NAME = AppIcon;/ASSETCATALOG_COMPILER_APP_ICON_NAME = AppIcon;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' {} +

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r onyx_beacon.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-beacon-ipa
          path: onyx_beacon.ipa